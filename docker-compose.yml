version: "3.9"
services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: tutorbot
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data: